# Builds, signs, notarizes and publishes Kiln when a version tag such as v0.1.0 is pushed.
# See docs/releasing.md for the secrets this needs. This workflow has not been run yet.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Check required secrets
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          for name in P12 P12_PASSWORD TEAM_ID APPLE_ID APP_PASSWORD; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then
              echo "::error::Missing release secret for $name. See docs/releasing.md."
              exit 1
            fi
          done

      - name: Install the signing certificate
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain
          rm "$RUNNER_TEMP/certificate.p12"

      - name: Install build tools
        run: |
          command -v cmake >/dev/null || brew install cmake
          brew install xcodegen

      - name: Test KilnCore
        run: swift test

      - name: Build the engine helper
        run: ./scripts/build-engine.sh

      - name: Build and sign the app
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodegen generate
          xcodebuild -project Kiln.xcodeproj -scheme Kiln -configuration Release \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath build/release \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            MARKETING_VERSION="${VERSION#v}" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            build
          codesign --verify --deep --strict --verbose=2 build/release/Build/Products/Release/Kiln.app

      - name: Package the disk image
        run: |
          ./scripts/package-dmg.sh build/release/Build/Products/Release/Kiln.app "Kiln-${VERSION#v}.dmg"
          codesign --force --sign "Developer ID Application" --timestamp "Kiln-${VERSION#v}.dmg"

      - name: Notarize and staple
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit "Kiln-${VERSION#v}.dmg" \
            --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APP_PASSWORD" --wait
          xcrun stapler staple "Kiln-${VERSION#v}.dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "Kiln-${VERSION#v}.dmg"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shasum -a 256 "Kiln-${VERSION#v}.dmg" > "Kiln-${VERSION#v}.dmg.sha256"
          gh release create "$VERSION" "Kiln-${VERSION#v}.dmg" "Kiln-${VERSION#v}.dmg.sha256" \
            --title "Kiln ${VERSION#v}" --generate-notes --draft
