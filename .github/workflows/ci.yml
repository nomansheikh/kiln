name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays, 06:00 UTC: recipes are re-checked against Hugging Face, where files can change or disappear.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request replaces the run in progress. Runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  conventions:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check file length and generated files
        run: ./scripts/check-conventions.sh

      # The build job is skipped when a pull request changes nothing but documentation.
      - name: Detect code changes
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          code=true
          if [ -n "$PULL_REQUEST" ]; then
            files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST/files" --paginate --jq '.[].filename')
            other=$(echo "$files" | grep -vE '\.md$|^\.github/ISSUE_TEMPLATE/' || true)
            if [ -n "$files" ] && [ -z "$other" ]; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Code changed: $code"

  recipes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The script reads the sampler and scheduler names from the stable-diffusion.cpp source.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Check recipes
        run: |
          status=0
          python3 scripts/recipe.py check || status=$?
          # Status 3 means Hugging Face could not be reached, not that a recipe is wrong.
          if [ "$status" -eq 3 ]; then
            echo "Hugging Face could not be reached. Trying once more in 60 seconds."
            sleep 60
            status=0
            python3 scripts/recipe.py check || status=$?
          fi
          exit "$status"

  build:
    needs: conventions
    if: needs.conventions.outputs.code == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test KilnCore
        run: swift test

      - name: Install build tools
        run: |
          command -v cmake >/dev/null || brew install cmake
          brew install xcodegen

      # Compiling the three helpers takes about ten minutes and their inputs rarely
      # change, so the built helpers are kept between runs. The key covers everything
      # that goes into them: the engines' commits, our wrapper code, the build script
      # and the compiler. A change to any of these builds them again.
      - name: Key for the built helpers
        id: helpers-key
        run: |
          {
            git submodule status --recursive
            xcodebuild -version
            cmake --version | head -n 1
          } > "$RUNNER_TEMP/helpers-inputs.txt"
          cat "$RUNNER_TEMP/helpers-inputs.txt"
          echo "toolchain=$(shasum -a 256 "$RUNNER_TEMP/helpers-inputs.txt" | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore the built helpers
        id: helpers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/engine/kiln-engine
            build/whisper/kiln-whisper
            build/audio/kiln-audio
          key: helpers-${{ runner.os }}-${{ runner.arch }}-${{ steps.helpers-key.outputs.toolchain }}-${{ hashFiles('Engine/**', 'scripts/build-engine.sh') }}

      - name: Build the helpers
        if: steps.helpers.outputs.cache-hit != 'true'
        run: ./scripts/build-engine.sh

      - name: Check the helpers
        run: |
          for helper in engine/kiln-engine whisper/kiln-whisper audio/kiln-audio; do
            test -x "build/$helper" || { echo "::error::build/$helper is missing"; exit 1; }
            file "build/$helper"
          done

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app
        run: >
          xcodebuild
          -scheme Kiln
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          build
