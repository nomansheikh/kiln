name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Check recipes
        run: python3 scripts/recipe.py check

      - name: Test KilnCore
        run: swift test

      - name: Install build tools
        run: |
          command -v cmake >/dev/null || brew install cmake
          brew install xcodegen

      - name: Build kiln-engine
        run: ./scripts/build-engine.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app
        run: >
          xcodebuild
          -scheme Kiln
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          build
