name: Recipe request
description: Ask for a model to be added as a curated recipe
labels: ["recipe"]
body:
  - type: markdown
    attributes:
      value: |
        A recipe is one small JSON file, and a script writes most of it. A pull request is the fastest way to get one added: see "Contributing a recipe" in CONTRIBUTING.md.
        If you would rather request it, the details below are what a recipe needs.
  - type: input
    id: model-name
    attributes:
      label: Model name
      placeholder: "Stable Diffusion XL Base 1.0"
    validations:
      required: true
  - type: textarea
    id: components
    attributes:
      label: Hugging Face links for each file
      description: |
        One link per file the model needs, with its role: checkpoint (a single all-in-one file), diffusion_model, llm (language-model text encoder), vae, clip_l, clip_g or t5xxl.
        Link to the exact file where you can. `.gguf` and `.safetensors` files are preferred.
      placeholder: |
        checkpoint: https://huggingface.co/<owner>/<repo>/blob/main/<file>.safetensors
    validations:
      required: true
  - type: textarea
    id: variants
    attributes:
      label: Quantizations, if the model has several
      description: |
        If the model is published in several quantizations (for example Q8 and Q4), list the files of each one. They become variants of one recipe.
        Say which files are the same for all of them.
      placeholder: |
        q8: diffusion_model https://huggingface.co/<owner>/<repo>/blob/main/<file>-Q8_0.gguf
        q4: diffusion_model https://huggingface.co/<owner>/<repo>/blob/main/<file>-Q4_K.gguf
        shared: vae https://huggingface.co/<owner>/<repo>/blob/main/<file>.safetensors
    validations:
      required: false
  - type: textarea
    id: license
    attributes:
      label: License
      description: The license of each file as stated on its Hugging Face page, including restrictions such as non-commercial use, with a link. List them separately if they differ.
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: Recommended settings, with a link for each
      description: |
        Steps, CFG, sampler, width and height as recommended by the model authors. Add scheduler, guidance, flow shift or a custom sigma schedule if the model card gives them.
        Give the model card link (or other primary source) for every setting. Settings without a source cannot be used.
      placeholder: |
        steps: 30 (https://huggingface.co/<owner>/<repo>#usage)
        cfg: 7.0 (same)
        sampler: euler (same)
        width x height: 1024 x 1024 (same)
    validations:
      required: true
  - type: input
    id: memory
    attributes:
      label: Memory needed, if known
      description: The smallest amount of system RAM you know the model runs on, and on which Mac. For several quantizations, give it for each. Leave empty if you have not run it.
      placeholder: "Runs on an M2 with 16 GB"
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: For example whether the model already runs in stable-diffusion.cpp.
    validations:
      required: false
