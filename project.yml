name: Kiln
options:
  bundleIdPrefix: codes.noman
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  Kiln:
    path: .

settings:
  base:
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "2"

targets:
  Kiln:
    type: application
    platform: macOS
    scheme:
      testTargets:
        - KilnAppTests
    sources:
      - path: App
      - path: recipes
        type: folder
        buildPhase: resources
      - path: catalog
        type: folder
        buildPhase: resources
      # Licence notices have to travel with the binary.
      - path: LICENSE
        buildPhase: resources
      - path: THIRD_PARTY.md
        buildPhase: resources
    dependencies:
      - package: Kiln
        product: KilnCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: codes.noman.kiln
        PRODUCT_NAME: Kiln
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Kiln
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.graphics-design
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Noman Sheikh. MIT License."
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
    postBuildScripts:
      - name: Bundle the helpers
        basedOnDependencyAnalysis: false
        script: |
          set -e
          if [ ! -x "$SRCROOT/build/engine/kiln-engine" ] || [ ! -x "$SRCROOT/build/whisper/kiln-whisper" ] \
            || [ ! -x "$SRCROOT/build/audio/kiln-audio" ] || [ ! -x "$SRCROOT/build/trellis/kiln-trellis" ]; then
            "$SRCROOT/scripts/build-engine.sh"
          fi
          # Each helper is signed here with the hardened runtime; Xcode then signs the app around them.
          # Notarization also needs a secure timestamp, which ad hoc signing cannot have.
          identity="${EXPANDED_CODE_SIGN_IDENTITY:--}"
          for helper in engine/kiln-engine whisper/kiln-whisper audio/kiln-audio trellis/kiln-trellis; do
            bundled="$BUILT_PRODUCTS_DIR/$EXECUTABLE_FOLDER_PATH/$(basename "$helper")"
            cp -f "$SRCROOT/build/$helper" "$bundled"
            if [ "$identity" = "-" ]; then
              codesign --force --sign - --options runtime "$bundled"
            else
              codesign --force --sign "$identity" --options runtime --timestamp "$bundled"
            fi
          done

  # Tests for the app's stores. The stores are compiled into the test bundle
  # itself, so the tests run without launching the app.
  KilnAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: App/Stores
        excludes:
          - AppModel.swift
          - UpdateStore.swift
      - path: App/Features/Generate/AudioPlayback.swift
      - path: App/Features/Models/ModelLibrary+RecipeImport.swift
      - path: Tests/KilnAppTests
    dependencies:
      - package: Kiln
        product: KilnCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: codes.noman.kiln.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
