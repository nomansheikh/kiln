name: Kiln
options:
  bundleIdPrefix: app.kiln
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  Kiln:
    path: .

settings:
  base:
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Kiln:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: recipes
        type: folder
        buildPhase: resources
    dependencies:
      - package: Kiln
        product: KilnCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kiln.Kiln
        PRODUCT_NAME: Kiln
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Kiln
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.graphics-design
        INFOPLIST_KEY_NSHumanReadableCopyright: "MIT License"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
    postBuildScripts:
      - name: Bundle kiln-engine
        basedOnDependencyAnalysis: false
        script: |
          set -e
          engine="$SRCROOT/build/engine/kiln-engine"
          if [ ! -x "$engine" ]; then
            "$SRCROOT/scripts/build-engine.sh"
          fi
          cp -f "$engine" "$BUILT_PRODUCTS_DIR/$EXECUTABLE_FOLDER_PATH/kiln-engine"
          codesign --force --sign - "$BUILT_PRODUCTS_DIR/$EXECUTABLE_FOLDER_PATH/kiln-engine"
