name: Kiln
options:
  bundleIdPrefix: codes.noman
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  Kiln:
    path: .

settings:
  base:
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Kiln:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: recipes
        type: folder
        buildPhase: resources
      # Licence notices have to travel with the binary.
      - path: LICENSE
        buildPhase: resources
      - path: THIRD_PARTY.md
        buildPhase: resources
    dependencies:
      - package: Kiln
        product: KilnCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: codes.noman.kiln
        PRODUCT_NAME: Kiln
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Kiln
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.graphics-design
        INFOPLIST_KEY_NSHumanReadableCopyright: "MIT License"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
    postBuildScripts:
      - name: Bundle the helpers
        basedOnDependencyAnalysis: false
        script: |
          set -e
          if [ ! -x "$SRCROOT/build/engine/kiln-engine" ] || [ ! -x "$SRCROOT/build/whisper/kiln-whisper" ]; then
            "$SRCROOT/scripts/build-engine.sh"
          fi
          # Each helper is signed here with the hardened runtime; Xcode then signs the app around them.
          # Notarization also needs a secure timestamp, which ad hoc signing cannot have.
          identity="${EXPANDED_CODE_SIGN_IDENTITY:--}"
          for helper in engine/kiln-engine whisper/kiln-whisper; do
            bundled="$BUILT_PRODUCTS_DIR/$EXECUTABLE_FOLDER_PATH/$(basename "$helper")"
            cp -f "$SRCROOT/build/$helper" "$bundled"
            if [ "$identity" = "-" ]; then
              codesign --force --sign - --options runtime "$bundled"
            else
              codesign --force --sign "$identity" --options runtime --timestamp "$bundled"
            fi
          done
